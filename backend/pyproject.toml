[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B008", "E731", "UP046", "E501"]  # B008: FastAPI Depends() in defaults is the framework idiom

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
